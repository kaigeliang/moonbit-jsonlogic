name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MoonBit stable
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies and record toolchain
        run: |
          moon version --all
          moon update
      - name: Check source, fixtures and public API
        run: |
          moon fmt --check
          python3 tools/generate_cases.py --check
          moon check --target native
          moon info --target native
          git diff --exit-code
      - name: Unit tests and runnable examples on every backend
        run: |
          for target in native js wasm wasm-gc; do
            moon test --target "$target"
            for example in form order filter; do
              moon run "src/examples/$example" --target "$target"
            done
          done
      - name: Compare against the original JavaScript implementation
        run: python3 tools/check_compat.py
      - name: External application integration
        run: python3 tools/check_consumer.py
      - name: Verify the conformance comparison gate
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Reproduce query-builder fixtures
        run: |
          npm ci --prefix tools/queryx-fixtures
          node tools/queryx-fixtures/generate.mjs --check
      - name: Verify JSONLogic to QueryX and PostgreSQL integration
        run: python3 tools/check_queryx.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jsonlogic-conformance
          path: output/compat/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jsonlogic-queryx-integration
          path: output/queryx/
          if-no-files-found: ignore
